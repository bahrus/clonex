<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Asynchronous Node</title>
</head>
<body>
    <div id=target></div>
    <script type=module>
        import {spawnAll} from '../spawnAll.js';

        const template = document.createElement('template');
        template.innerHTML = '<div class="spawned"></div>';
        const clone = template.content.cloneNode(true);

        // Define spawn mapping
        const options = {
            0: [{
                spawn: async () => {
                    const { TestSpawn } = await import('./TestSpawn.js');
                    return TestSpawn;
                },
                spawnInfo: { data: 'test' }
            }]
        };
        const instanceMap = await spawnAll(clone, options);
        console.log({instanceMap});
        if(clone.childNodes[0]?.textContent === 'Spawned!'){
            target.setAttribute('mark', 'good');
        }

    </script>
</body>
</html>
